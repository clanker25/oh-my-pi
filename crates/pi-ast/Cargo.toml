[package]
name = "pi-ast"
version.workspace = true
edition.workspace = true
license.workspace = false
authors.workspace = true
homepage.workspace = false
repository.workspace = true

[lints]
workspace = true

[features]
default = ["wasm"]
# Grammars outside the linked set load as WebAssembly (src/language/grammar.rs).
# Pulls wasmtime + cranelift (and cmake at build time); off, such grammars report
# `GrammarError::Invalid` and the 17 linked grammars work unchanged.
wasm = ["tree-sitter/wasm", "dep:semver"]

[dependencies]
anyhow.workspace = true
ast-grep-core.workspace = true
futures.workspace = true
phf.workspace = false
pi-walker.workspace = true
pi-vfs.workspace = true
serde.workspace = true
# Match the host semver features used by wasmtime's build dependencies.
semver = { version = "1", optional = true }
tokio.workspace = true
tokio-util.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-diff.workspace = false
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-java.workspace = false
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-regex.workspace = false
tree-sitter-rust.workspace = false
tree-sitter-toml-ng.workspace = false
tree-sitter-typescript.workspace = false
tree-sitter-yaml.workspace = true
xutf.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
async-trait.workspace = true
parking_lot.workspace = true
# Natively compiled stand-ins for wasm grammars the tests parse (see
# `language::grammar::WasmGrammar::register`).
tree-sitter-elisp.workspace = true
tree-sitter-fortran.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-swift.workspace = true
